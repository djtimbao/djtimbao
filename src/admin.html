<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DJ Panel | Timbao</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="/css/output.css" rel="stylesheet">
    
    <script>
        window.handleGoogleLogin = function(response) {
            if (typeof window.adminHandleGoogleLogin === 'function') {
                window.adminHandleGoogleLogin(response);
            }
        };
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <meta name="color-scheme" content="dark only">
    <meta name="theme-color" content="#09090b">
    <style>body { font-family: 'Montserrat', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased">

    <!-- PANTALLA DE LOGIN -->
    <section id="auth-section" class="min-h-screen flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 p-8 rounded-2xl shadow-2xl flex flex-col items-center">
            <h1 class="text-2xl font-black text-[#e3bb3e] tracking-tighter uppercase mb-2">DJ Panel</h1>
            <p class="text-xs text-zinc-400 text-center mb-8 uppercase tracking-widest">Acceso Restringido</p>
            
            <div id="g_id_onload"
                data-client_id="274539249936-hi50mbgmp0a20ldrp0thfvj96o8ulm93.apps.googleusercontent.com"
                data-callback="handleGoogleLogin"
                data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-shape="rectangular"></div>
            
            <p id="auth-error" class="text-xs text-red-400 mt-4 hidden text-center"></p>
        </div>
    </section>

    <!-- PANEL DE ADMINISTRACIÓN -->
    <main id="app-section" class="hidden flex-col min-h-screen pb-20">
        
        <!-- HEADER ADMIN -->
        <header class="sticky top-0 z-50 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-900 p-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="/img/djt-logo-amarillo.svg" alt="DJ Timbao" class="w-8 h-8 rounded-full bg-zinc-950 p-0.5 object-contain">
                <div>
                    <h1 class="text-sm font-black text-white uppercase tracking-wider leading-none">Timbao Admin</h1>
                    <p class="text-[10px] text-zinc-400 uppercase tracking-widest mt-0.5">Live Control</p>
                </div>
            </div>
            <button id="logout-btn" class="text-xs font-bold text-red-400 uppercase tracking-wider px-3 py-2 bg-red-400/10 rounded-lg active:scale-95 transition-transform">
                Salir
            </button>
        </header>

        <!-- TABS DE NAVEGACIÓN -->
        <div class="flex p-4 gap-2">
            <button id="tab-pedidos" class="flex-1 py-3 text-xs font-black uppercase tracking-wider rounded-lg bg-[#e3bb3e] text-black transition-all">Pedidos Live</button>
            <button id="tab-eventos" class="flex-1 py-3 text-xs font-black uppercase tracking-wider rounded-lg bg-zinc-900 text-zinc-500 border border-zinc-800 transition-all">Eventos</button>
        </div>

        <!-- VISTA 1: PEDIDOS LIVE -->
        <section id="view-pedidos" class="flex-1 p-4 flex flex-col gap-4">
            <div class="flex justify-between items-end border-b border-zinc-900 pb-2">
                <h2 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Pista Actual
                </h2>
                <div class="flex gap-3">
                    <button id="refresh-pedidos" class="text-[10px] uppercase font-bold text-zinc-400 flex items-center gap-1 hover:text-white transition-colors">
                        <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><path d="M12 2.75a9.25 9.25 0 1 0 4.737 17.197l-1.35-2.023A6.75 6.75 0 1 1 12 5.25v3.5L17.25 4 12 -.75v3.5z"/></svg>
                        Actualizar
                    </button>
                    <button id="clear-pedidos" class="text-[10px] uppercase font-bold text-red-400 flex items-center gap-1 hover:text-red-300 transition-colors">
                        <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><path d="M3 6v18h18V6H3zm5 14c0 .552-.448 1-1 1s-1-.448-1-1V10c0-.552.448-1 1-1s1 .448 1 1v10zm5 0c0 .552-.448 1-1 1s-1-.448-1-1V10c0-.552.448-1 1-1s1 .448 1 1v10zm5 0c0 .552-.448 1-1 1s-1-.448-1-1V10c0-.552.448-1 1-1s1 .448 1 1v10zm4-18v2H2V2h5.711c.9 0 1.631-1.099 1.631-2h5.315c0 .901.73 2 1.631 2H22z"/></svg>
                        Limpiar Lista
                    </button>
                </div>
            </div>
            
            <ul id="admin-queue-list" class="flex flex-col gap-3"></ul>

            <div class="mt-4">
                <h2 class="text-xs font-bold text-zinc-500 uppercase tracking-wider mb-3 border-b border-zinc-900 pb-2">Ya Sonaron</h2>
                <ul id="admin-history-list" class="flex flex-col gap-2"></ul>
            </div>
        </section>

        <!-- VISTA 2: GESTIÓN DE EVENTOS -->
        <section id="view-eventos" class="hidden flex-1 p-4 flex-col gap-6">
            
            <!-- Formulario Crear Evento -->
            <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl">
                <h2 class="text-xs font-bold text-[#e3bb3e] uppercase tracking-wider mb-4 border-b border-zinc-800 pb-2">Agregar Nueva Fecha</h2>
                <form id="evento-form" class="flex flex-col gap-3">
                    <input type="hidden" id="ev-id">
                    <input type="text" id="ev-title" placeholder="Título (Ej: Cuba en su salsa)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-3 text-xs text-white focus:border-[#e3bb3e] outline-none" required>
                    <div class="flex gap-3">
                        <input type="text" id="ev-date" placeholder="Fecha (Ej: 04 Sep)" class="w-1/2 bg-zinc-950 border border-zinc-800 rounded p-3 text-xs text-white focus:border-[#e3bb3e] outline-none" required>
                        <input type="text" id="ev-time" placeholder="Hora (Ej: 21:00 Hrs)" class="w-1/2 bg-zinc-950 border border-zinc-800 rounded p-3 text-xs text-white focus:border-[#e3bb3e] outline-none" required>
                    </div>
                    <input type="text" id="ev-location" placeholder="Ubicación (Ej: Buenos Aires, CABA)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-3 text-xs text-white focus:border-[#e3bb3e] outline-none" required>
                    
                    <div class="w-full bg-zinc-950 border border-zinc-800 rounded p-3 focus-within:border-[#e3bb3e] transition-colors">
                        <label for="ev-flyer" class="block text-[10px] text-zinc-500 uppercase tracking-widest mb-2">Flyer del Evento (Max 2MB)</label>
                        <input type="file" id="ev-flyer" accept="image/webp, image/jpeg, image/png" class="w-full text-xs text-zinc-300 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-[10px] file:font-black file:uppercase file:tracking-wider file:bg-[#e3bb3e] file:text-black hover:file:bg-yellow-500 hover:file:scale-95 transition-all outline-none" required>
                    </div>
                    
                    <input type="url" id="ev-action" placeholder="Link de Acción (Instagram/Tickets)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-3 text-xs text-white focus:border-[#e3bb3e] outline-none" required>
                    
                    <div class="flex gap-2 mt-2">
                        <button type="button" id="btn-cancel-ev" class="hidden flex-1 bg-zinc-800 text-white font-black uppercase text-xs tracking-wider p-3 rounded active:scale-95 transition-transform">
                            Cancelar
                        </button>
                        <button type="submit" id="btn-submit-ev" class="flex-[2] bg-white text-black font-black uppercase text-xs tracking-wider p-3 rounded active:scale-95 transition-transform">
                            Publicar Evento
                        </button>
                    </div>
                </form>
            </div>

            <!-- Lista de Eventos -->
            <div>
                <h2 class="text-xs font-bold text-zinc-500 uppercase tracking-wider mb-3">Eventos Activos</h2>
                <ul id="admin-eventos-list" class="flex flex-col gap-3"></ul>
            </div>
        </section>

    </main>

    <script type="module" src="/js/adminApp.js"></script>
</body>
</html>
