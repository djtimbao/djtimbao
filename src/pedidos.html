<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pedidos | DJ Timbao</title>
    
    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- CSS Compilado de Tailwind -->
    <link href="/css/output.css" rel="stylesheet">
    
    <!-- Proxy para evitar la condición de carrera de GSI -->
    <script>
    window.handleGoogleLogin = function(response) {
        window.pendingGoogleResponse = response;
        if (typeof window.appHandleGoogleLogin === 'function') {
            window.appHandleGoogleLogin(response);
        }
    };
    </script>

    <!-- Script Oficial de Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <meta name="color-scheme" content="dark only">
    <meta name="theme-color" content="#09090b">

    <style>
        body { font-family: 'Montserrat', sans-serif; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-[#e3bb3e] selection:text-black">

    <main class="w-full max-w-md mx-auto min-h-screen flex flex-col p-4 sm:p-6 pb-20">
        
        <!-- HEADER GLOBAL -->
        <header class="flex flex-col items-center justify-center py-6 border-b border-zinc-900 relative">
            <a href="/" class="absolute left-0 w-9 h-9 flex items-center justify-center bg-zinc-900 border border-zinc-800 rounded-full text-zinc-400 hover:text-black hover:bg-[#e3bb3e] hover:border-[#e3bb3e] transition-all duration-300 hover:scale-105 active:scale-95 group" aria-label="Volver al inicio">
                <svg class="w-4 h-4 fill-current transform group-hover:-translate-x-0.5 transition-transform" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 11H6.414l5.293-5.293-1.414-1.414L2.586 12l7.707 7.707 1.414-1.414L6.414 13H21z"/></svg>
            </a>
            <div id="header-logo" class="w-26 md:w-32 h-full text-[#e3bb3e] fill-current"></div>
            <p class="text-xs font-bold tracking-widest text-zinc-500 uppercase mt-2">Pedidos de canciones</p>
        </header>

        <!-- SECCIÓN DE AUTENTICACIÓN -->
        <section id="auth-section" class="flex flex-col items-center justify-center py-10">
            <p class="text-sm text-zinc-400 text-center mb-6">Inicia sesión para pedir tu tema y armar la fiesta.</p>
            
            <!-- Contenedor nativo de Google. -->
            <div id="g_id_onload"
                 data-client_id="274539249936-hi50mbgmp0a20ldrp0thfvj96o8ulm93.apps.googleusercontent.com"
                 data-callback="handleGoogleLogin"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-shape="rectangular"></div>
        </section>

        <!-- ========================================== -->
        <!-- 2. SECCIÓN: LOBBY DE FIESTAS -->
        <!-- ========================================== -->
        <section id="lobby-section" class="hidden flex-col gap-4 mt-6">
            <div class="text-center mb-4">
                <h2 class="text-lg font-black text-white uppercase tracking-wider">Elige tu Fiesta</h2>
                <p class="text-xs text-zinc-500 mt-1">Selecciona el evento donde estás ahora mismo</p>
            </div>
            <!-- Contenedor inyectado desde JS -->
            <div id="lobby-events-container" class="flex flex-col gap-4"></div>
        </section>

        <!-- ========================================== -->
        <!-- 3. SECCIÓN: APLICACIÓN (PEDIDOS) -->
        <!-- ========================================== -->
        <section id="app-section" class="hidden flex-col gap-8 mt-6">
            
            <div class="flex items-center justify-between bg-zinc-900/50 border border-zinc-800/50 p-3 rounded-lg">
                <div class="flex items-center gap-3 overflow-hidden">
                    <img id="active-event-flyer" src="" class="w-10 h-10 object-cover rounded shadow-sm bg-black shrink-0">
                    <div class="min-w-0">
                        <p class="text-[9px] text-[#e3bb3e] font-bold uppercase tracking-widest">Estás en:</p>
                        <h2 id="active-event-title" class="text-sm font-black text-white truncate"></h2>
                    </div>
                </div>
                <button id="btn-back-lobby" class="shrink-0 w-8 h-8 flex items-center justify-center bg-zinc-800 text-zinc-400 rounded-md hover:text-white hover:bg-zinc-700 transition-colors active:scale-95">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>
                </button>
            </div>

            <!-- Formulario de Pedido -->
            <div class="flex flex-col gap-5">
                
                <!-- Sistema de Pestañas (Tabs) -->
                <div class="flex p-1 bg-zinc-900 rounded-lg border border-zinc-800 w-full">
                    <button type="button" id="tab-manual" class="flex-1 py-2.5 text-[10px] sm:text-xs font-bold uppercase tracking-wider rounded-md text-zinc-500 hover:text-zinc-300 transition-all duration-300">
                        Escribir Nombre
                    </button>
                    <button type="button" id="tab-link" class="flex-1 py-2.5 text-[10px] sm:text-xs font-bold uppercase tracking-wider rounded-md bg-zinc-800 text-white shadow-sm transition-all duration-300 pointer-events-none">
                        Pegar Link
                    </button>
                </div>

                <form id="request-form" class="flex flex-col gap-4">
                    <!-- Modo 2: Manual -->
                    <div id="mode-manual" class="hidden flex-col gap-3">
                        <div class="flex flex-col gap-2">
                            <label for="song-title" class="text-xs font-bold text-zinc-500 uppercase tracking-wider">Título de la Canción *</label>
                            <input type="text" id="song-title" placeholder="Ej: Soy todo" 
                                   class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3.5 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-[#e3bb3e] transition-colors rounded-none appearance-none">
                        </div>
                        <div class="flex flex-col gap-2">
                            <label for="song-artist" class="text-xs font-bold text-zinc-500 uppercase tracking-wider">Artista | Opcional</label>
                            <input type="text" id="song-artist" placeholder="Ej: Los Van Van" 
                                   class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3.5 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-[#e3bb3e] transition-colors rounded-none appearance-none">
                        </div>
                    </div>

                    <!-- Modo 1: Link -->
                    <div id="mode-link" class="flex flex-col gap-2">
                        <label for="song-url" class="text-xs font-bold text-zinc-500 uppercase tracking-wider">Enlace de YouTube, YT Music o Spotify</label>
                        <input type="url" id="song-url" placeholder="https://youtu.be/..." 
                               class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3.5 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-[#e3bb3e] transition-colors rounded-none appearance-none">
                    </div>

                    <!-- Botón de Envío Full-Width -->
                    <button type="submit" id="submit-btn" 
                            class="bg-[#e3bb3e] text-black font-black uppercase text-xs tracking-wider px-6 py-4 rounded-lg active:scale-95 transition-transform flex items-center justify-center w-full shadow-lg">
                        Pedir Tema
                    </button>
                    <p id="form-message" class="text-xs hidden mt-1 font-medium text-center"></p>
                </form>
            </div>

            <!-- Lista de Canciones en Cola -->
            <div>
                <h2 class="text-sm font-bold text-white uppercase tracking-wider mb-3 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-[#e3bb3e] animate-pulse"></span>
                    En Cola
                </h2>
                <ul id="queue-list" class="flex flex-col gap-3"></ul>
            </div>

            <!-- Historial de Reproducidas -->
            <div class="mt-4">
                <h2 class="text-xs font-bold text-zinc-600 uppercase tracking-wider mb-3 border-b border-zinc-900 pb-2">
                    Ya Sonaron
                </h2>
                <ul id="history-list" class="flex flex-col gap-2"></ul>
            </div>

        </section>
    </main>

    <template id="tpl-song-pending">
        <li class="flex items-center gap-3 bg-zinc-900 border border-zinc-800 p-2 rounded-lg relative overflow-hidden group">
            <img src="" alt="Cover" class="w-14 h-14 rounded object-cover shrink-0 tpl-img bg-zinc-950">
            <div class="flex-1 min-w-0 flex flex-col justify-center">
                <h3 class="text-sm font-bold text-zinc-100 truncate tpl-title"></h3>
                <p class="text-xs text-zinc-400 truncate tpl-artist"></p>
                <div class="flex items-center gap-2 mt-0.5">
                    <span class="text-[9px] font-bold uppercase tracking-widest text-[#e3bb3e] tpl-platform"></span>
                    <span class="text-[9px] font-medium text-zinc-600 tpl-time-request hidden"></span>
                </div>
            </div>
            <a href="#" target="_blank" rel="noopener noreferrer" class="shrink-0 w-10 h-10 flex items-center justify-center bg-zinc-800 hover:bg-zinc-700 rounded-md active:scale-95 transition-all tpl-link">
                <svg class="w-4 h-4 fill-zinc-300" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </a>
        </li>
    </template>

    <template id="tpl-song-played">
        <li class="flex items-center gap-3 bg-transparent border border-zinc-900 p-2 rounded-lg opacity-60 grayscale">
            <img src="" alt="Cover" class="w-10 h-10 rounded opacity-50 object-cover shrink-0 tpl-img">
            <div class="flex-1 min-w-0 flex flex-col justify-center">
                <h3 class="text-xs font-semibold text-zinc-500 line-through truncate tpl-title"></h3>
                <p class="text-[10px] text-zinc-600 truncate tpl-artist"></p>
                <p class="text-[9px] mt-0.5 font-medium text-zinc-700 tpl-time-played"></p>
            </div>
            <div class="shrink-0 w-6 h-6 flex items-center justify-center">
                <svg class="w-4 h-4 text-zinc-600 fill-current" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            </div>
        </li>
    </template>

    <script type="module" src="/js/pedidosApp.js"></script>
</body>
</html>
